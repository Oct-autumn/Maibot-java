version = "0.1.0"

# Bot信息配置
[bot_info]
# Bot名称
# 该名称将用于构建Bot的身份，Bot将以这个名称与用户进行交互
name = ""
# Bot别名列表（可选）
# 这些别名也可以用于指代Bot，提供更多的称呼选择，使得Bot在与用户的交流中更加自然和多样化
# aliases = []


[log]
# 是否启用MDC跟踪（Mapped Diagnostic Context，映射诊断上下文）
# 该功能用于在日志中跟踪特定的上下文信息，如请求ID、用户ID等，对于调试和分析日志非常有帮助。
# 启用后可以在日志输出中包含这些上下文信息，以便更好地理解日志事件的来源和关联。
# 如果你不是开发者，建议保持默认值false以避免日志输出过于冗杂。
# enable_mdc_track = true

# 控制台日志配置
[log.console]
# 日志输出级别
# 可选值包括："trace" < "debug" < "info"（默认） < "warn" < "error" < "off"
# （从最详细到最简洁，off表示关闭日志输出）
# level = "info"

# 日志过滤规则
# 格式 "包名:日志级别"，如 "org.hibernate:info"
# 不填写日志级别则默认为"off"，表示关闭该包的日志
# 如果你不清楚如何配置，建议保持默认
filter_rule = [
    "org.hibernate:warn",
    "org.jboss:warn",
    "com.mchange:warn",
    "org.sqlite:warn",
    "io.netty:warn",
    "org.ehcache:warn",
]

# 文件日志配置
[log.file]
# 日志输出级别
# 可选值包括："trace" < "debug" < "info"（默认） < "warn" < "error" < "off"
# （从最详细到最简洁，off表示关闭日志输出）
# level = "info"

# 最大日志文件数量
# 当日志文件达到指定数量后，最旧的文件将被删除以腾出空间
# 默认为5
# max_rolling_files = 5
# 最大日志总大小（单位：MB）
# 当日志文件总大小达到指定值后，最旧的文件将被删除以腾出空间
# 默认为100MB
# max_total_size_mb = 100

# 日志过滤规则
# 格式 "包名:日志级别"，如 "org.hibernate:info"
# 不填写日志级别则默认为"off"，表示关闭该包的日志
# 如果你不清楚如何配置，建议保持默认
filter_rule = [
    "org.hibernate:warn",
    "org.jboss:warn",
    "com.mchange:warn",
    "org.sqlite:warn",
    "io.netty:warn",
    "org.ehcache:warn",
]

# 网络配置
[network]
# 服务端监听的IP地址
# 如果你希望Bot只能在本地访问，使用127.0.0.1即可；
host = "127.0.0.1"
# 服务端监听的端口号
# 你可以根据需要修改端口号，但请确保该端口未被其他应用占用，并且在防火墙中允许访问（如果需要远程访问的话）
port = 8080
# 验证Token（可选）
# 由大小写字母、数字和特殊字符组成，建议使用长度较长且复杂的字符串，以防止被猜测或暴力破解。
# 在Bot的API请求中，客户端需要在请求头中包含这个Token（Authorization: Bearer <token>）
# 如果你将Bot部署在公共网络上，建议启用该项以增加安全性。
# auth_token = "your_secure_token_here"

# 思考配置
[thinking]
# 观察窗口大小
# 该参数定义了Bot在进行思考时能够回顾的消息数。
# 较大的观察窗口可以让Bot更好地理解上下文，但也会增加Token的消耗。
# 你可以根据实际情况调整这个值，建议在20-50之间进行尝试，以找到最佳的性能和上下文理解平衡点。
# 默认为30
# observation_window_size = 30

# ACTIVE 首次/重置后的观察间隔（秒）
# active_interval_sec = 30
# ACTIVE 退避后的最大观察间隔（秒）
# active_max_interval_sec = 120
# FOCUSED 首次/重置后的主动观察间隔（秒）
# focus_interval_sec = 15
# FOCUSED 退避后的最大主动观察间隔（秒）
# focus_max_interval_sec = 300
# 每次 wait_and_watch 后间隔的增长因子；1.0 表示固定间隔
# interval_growth_factor = 2.0
# 到达最大间隔后仍会再观察两轮，两轮都没有新消息/发言/状态动作就退出当前状态

# ObserverAI 配置
[thinking.observer]
# 观察模型任务名，对应 [[model_tasks.observer]]
# model_task = "observer"
# 单次观察等待模型的最长时间（秒）
# timeout_sec = 30
# 一次观察内最多几轮工具调用
# max_tool_rounds = 4

# 观察模型任务示例（与 [[model_tasks.chat]] 同级）
# [[model_tasks.observer]]
# model_name = "your-model"
# temperature = 0.7
# max_tokens = 512

# 聊天配置（M3：观察窗口驱动发言）
[chat]
# 是否启用聊天
# 默认为false，即不主动聊天
# enabled = false
# 回环调试模式：收到私聊消息后把渲染结果原样发回，仅用于验证出站通道，正式使用请保持关闭
# debug_echo = false
# 观察窗口初始载入时引用的历史消息条数
# history_limit = 20
# 调用模型的最长等待时间（秒）
# reply_timeout_sec = 60
# 发言使用的模型任务名（对应 [[model_tasks.chat]]）
# model_task = "chat"
# 人设文件路径（相对于运行目录）
# persona_file = "config/persona.txt"
# 允许对话的用户平台ID列表；为空表示不限制
# allowed_users = []

# 模型调用存档配置
# model_api_request 记录每次调用统计；model_interaction 记录原始输出，便于复盘
[model_log]
# 需要保存原始输出的任务名列表；为空则只写统计表
# persist_content_tasks = ["chat", "observer"]
# 单个文本字段的最大字符数，超出会被截断
# content_max_chars = 20000
# model_interaction 保留天数，0 表示不清理
# content_retention_days = 30
# 过期内容清理的检查间隔（分钟），0 表示只在启动时清理一次
# cleanup_interval_minutes = 60
